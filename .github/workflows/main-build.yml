name: "Main Branch Build"

# Runs an unsigned cross-platform build on every push to main so breakage is
# caught before a manual release is triggered. Artifacts are kept for 30 days
# so any commit on main has a downloadable, testable build.
#
# Signing is intentionally disabled here: this fork does not ship Apple /
# Azure signing secrets. Signed builds belong in release.yml when secrets exist.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Signing is neutralized via a tauri `-c` config override so unsigned
          # builds succeed without release secrets:
          #   createUpdaterArtifacts=false  -> no minisign updater key needed
          #   windows.signCommand=null      -> skip trusted-signing-cli
          - platform: "windows-latest"
            args: '-c {"bundle":{"createUpdaterArtifacts":false,"windows":{"signCommand":null}}}'
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            args: '--bundles deb -c {"bundle":{"createUpdaterArtifacts":false}}'
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04"
            args: '--bundles appimage,rpm -c {"bundle":{"createUpdaterArtifacts":false}}'
            target: "x86_64-unknown-linux-gnu"
          # macOS omitted: tauri.conf.json pins macOS.signingIdentity = "-", so
          # the bundler always codesigns and needs Apple secrets this fork lacks.

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      upload-artifacts: true
      sign-binaries: false
    secrets: inherit
