name: Private test builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Windows desktop test build
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Fetch Silero VAD model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/models | Out-Null
          Invoke-WebRequest `
            -Uri https://blob.handy.computer/silero_vad_v4.onnx `
            -OutFile src-tauri/resources/models/silero_vad_v4.onnx

      - name: Locate VC++ runtime for app-local bundling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }

          $versionFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile).Trim()
          $redistRoot = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          $crt = Get-ChildItem $redistRoot -Directory -Filter "Microsoft.VC*.CRT" |
            Sort-Object Name | Select-Object -Last 1
          $omp = Get-ChildItem $redistRoot -Directory -Filter "Microsoft.VC*.OpenMP" |
            Sort-Object Name | Select-Object -Last 1

          if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) {
            throw "VC++ CRT runtime was not found"
          }
          if (-not $omp -or -not (Test-Path (Join-Path $omp.FullName "vcomp140.dll"))) {
            throw "VC++ OpenMP runtime was not found"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      - name: Install ONNX Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ortVersion = "1.24.2"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ortVersion/onnxruntime-win-x64-$ortVersion.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath ort-dist -Force
          $ortLib = (Resolve-Path "ort-dist/onnxruntime-win-x64-$ortVersion/lib").Path
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_LIB_LOCATION=$ortLib"
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_PREFER_DYNAMIC_LINK=1"

      - name: Install SPIRV-Headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\', '/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=$combined"

      - name: Build unsigned Windows installers
        shell: pwsh
        run: >-
          bun run tauri build --bundles nsis,msi -c
          '{"bundle":{"createUpdaterArtifacts":false,"windows":{"signCommand":null}}}'

      - name: Upload Windows test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handy-remote-poc-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  android-apk:
    name: Android APK test build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check mobile client
        run: bun run lint

      - name: Generate Android project
        run: bunx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Build APK with Gradle
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android test artifact
        uses: actions/upload-artifact@v4
        with:
          name: handy-remote-poc-android-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
