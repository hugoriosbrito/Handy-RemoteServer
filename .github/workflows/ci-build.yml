name: "CI Build"

# Continuous integration build for both deliverables:
#   * Handy desktop (Tauri) via the reusable build.yml, unsigned, on a core
#     cross-platform subset (Windows x64, Linux x64).
#   * Handy Remote mobile Android APK via Expo prebuild + Gradle (debug-signed
#     release APK, no EAS account or secrets required).
#
# Runs on demand and on pushes / PRs that touch either app. Artifacts are kept
# for 14 days so any commit can be smoke-tested.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend unit tests. The desktop job below proves the app *builds*; nothing
  # was running `cargo test`, so a broken remote-server invariant (auth, pairing,
  # rate limiting, response cache) could only be caught by hand.
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend tests (cargo test)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ubuntu-22.04-tests

      - name: install dependencies (ubuntu 22.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev libgtk-layer-shell0 libgtk-layer-shell-dev

      # Linux links transcribe-cpp with the `vulkan` feature (see
      # src-tauri/Cargo.toml), so ggml-vulkan's shader generator needs the SDK
      # even for a test build.
      - name: Prepare Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-jammy.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-jammy.list
          sudo apt update
          sudo apt install vulkan-sdk -y

      # Bundled as a Tauri resource, so the crate expects it to exist.
      - name: Fetch Silero VAD model
        run: |
          mkdir -p src-tauri/resources/models
          curl -fSL -o src-tauri/resources/models/silero_vad_v4.onnx https://blob.handy.computer/silero_vad_v4.onnx

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run backend unit tests
        working-directory: src-tauri
        run: cargo test --lib

  # ---------------------------------------------------------------------------
  # Desktop (Tauri) — reuse the battle-tested build.yml. Unsigned so it needs no
  # signing secrets; a representative subset keeps CI time reasonable.
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.target }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Signing is neutralized via a tauri `-c` config override so unsigned
          # CI builds succeed on a fork without release secrets:
          #   createUpdaterArtifacts=false  -> no minisign updater key needed
          #   windows.signCommand=null      -> skip trusted-signing-cli
          - platform: "windows-latest"
            args: '-c {"bundle":{"createUpdaterArtifacts":false,"windows":{"signCommand":null}}}'
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            args: '--bundles deb -c {"bundle":{"createUpdaterArtifacts":false}}'
            target: "x86_64-unknown-linux-gnu"
          # macOS is intentionally omitted from CI: tauri.conf.json pins
          # macOS.signingIdentity = "-", so the bundler always codesigns, which
          # needs Apple signing secrets this repo/fork doesn't provide. Windows
          # and Linux build unsigned. Signed macOS builds run in release.yml /
          # main-build.yml where the Apple secrets are available.
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "handy-ci"
      upload-artifacts: true
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Mobile (Expo / React Native) — produce an installable Android APK.
  # ---------------------------------------------------------------------------
  mobile-apk:
    name: Mobile Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check (tsc)
        run: bun run lint

      - name: Expo prebuild (generate android/)
        run: bunx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Build release APK (Gradle)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: echo "path=$(find app/build/outputs/apk/release -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"
        working-directory: mobile/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: handy-remote-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
